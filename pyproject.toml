[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-git-cli"
version = "0.1.0"
description = "A lightweight Git CLI assistant that generates Conventional Commits messages and release notes with GPT-4o-mini."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Khayal Ismayilzada" }]
keywords = ["git", "cli", "conventional-commits", "openai", "changelog"]
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "GitPython>=3.1",
    "openai>=1.30",
]

[project.scripts]
smart-git = "smart_git_cli.cli:app"

[tool.setuptools.packages.find]
include = ["smart_git_cli*"]